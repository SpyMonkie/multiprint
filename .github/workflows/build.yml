name: Build MultiPrint Executable

on:
  push:
    branches: [ main, master ]
    tags:
      - 'v*'
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    permissions:
      contents: write

    steps:
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'
        cache: 'pip'

    - name: Install dependencies
      run: |
        python -m pip install --upgrade pip
        pip install pywin32 pyinstaller

    - name: Build Executable with PyInstaller
      run: |
        pyinstaller MultiPrint.spec

    # Uploads the EXE as an artifact on every commit / PR
    - name: Upload Build Artifact
      uses: actions/upload-artifact@v4
      with:
        name: MultiPrint-EXE
        path: dist/printmulti2.exe

    # Automatically creates a release and attaches the EXE when pushing a tag (e.g. v1.0.0)
    - name: Release to GitHub Releases
      if: startsWith(github.ref, 'refs/tags/')
      uses: softprops/action-gh-release@v2
      with:
        files: dist/printmulti2.exe
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
